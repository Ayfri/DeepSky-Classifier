[project]
name = "deepsky-classifier"
version = "0.2.0"
description = "Astronomical data pipeline and ML classifier for stars, galaxies, and quasars."
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [{ name = "Pierre Ayfri", email = "pierre.ayfri@gmail.com" }]
keywords = ["astronomy", "machine-learning", "etl", "fastapi", "scikit-learn"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "alembic>=1.18.4",
    "astropy>=7.2.0",
    "astroquery>=0.4.11",
    "colorama>=0.4.6",
    "fastapi>=0.135.3",
    "httpx>=0.28.1",
    "joblib>=1.5.3",
    "orjson>=3.11.8",
    "pandas>=3.0.2",
    "prefect>=3.6.25",
    "psycopg[binary,pool]>=3.2.10",
    "pyarrow>=23.0.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.6.0",
    "pyvo>=1.8.1",
    "scikit-learn>=1.8.0",
    "sqlalchemy>=2.0.49",
    "tqdm>=4.67.3",
    "uvicorn[standard]>=0.44.0",
]

[project.urls]
Homepage = "https://github.com/Ayfri/deepsky-classifier"
Repository = "https://github.com/Ayfri/deepsky-classifier"

[project.scripts]
deepsky-api = "src.api.main:run"
deepsky-pipeline = "src.workflows.pipeline:deepsky_pipeline"
deepsky-train = "src.ml.train:main"

[dependency-groups]
dev = [
    "pyrefly>=1.0.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.15.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ---------------------------------------------------------------------------
# Ruff: industrial-grade lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".venv", "data", "models", "build", "dist"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "ANN",  # flake8-annotations
    "ASYNC",
    "S",    # flake8-bandit
    "BLE",  # blind-except
    "FBT",  # boolean-trap
    "A",    # builtins shadow
    "COM",  # trailing comma
    "DTZ",  # datetimez
    "EM",   # error-messages
    "EXE",  # executable
    "ISC",  # implicit-str-concat
    "LOG",
    "G",    # logging-format
    "PIE",
    "T20",  # print
    "PT",   # pytest
    "Q",    # quotes
    "RSE",  # raise
    "RET",  # return
    "SIM",  # simplify
    "TID",  # tidy-imports
    "TCH",  # type-checking
    "ARG",  # unused-arg
    "PTH",  # use-pathlib
    "PL",   # pylint
    "TRY",  # tryceratops
    "FLY",
    "PERF",
    "RUF",
]
ignore = [
    "ANN401",  # allow Any for kwargs in catalog extractors
    "COM812",  # trailing comma conflict with formatter
    "E101",    # mixed spaces/tabs (tab project)
    "ISC001",  # conflict with formatter
    "PLR0913", # function arguments count (CLI/API entry points)
    "PLR2004", # magic value comparisons (lots in scientific code)
    "S101",    # use of assert (fine in tests)
    "TRY003",  # long exception messages
    "W191",    # indentation contains tabs (tab project)
    "EM101",
    "EM102",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "S", "PLR2004", "ARG", "FBT"]
"src/ml/train.py" = ["T201"]
"src/api/**/*.py" = ["B008"]  # FastAPI Depends pattern

[tool.ruff.lint.isort]
known-first-party = ["src"]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.lint.pydocstyle]
convention = "google"

# ---------------------------------------------------------------------------
# Pyrefly: strict static type checking
# ---------------------------------------------------------------------------
[tool.pyrefly]
project-includes = ["src", "tests"]
project-excludes = [".venv", "data", "models", "build", "dist"]
python-version = "3.13"
search-path = ["src"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "slow: marks tests as slow",
]
asyncio_mode = "auto"

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src"]
branch = true
omit = ["src/workflows/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
