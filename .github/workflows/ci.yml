name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.13"
  UV_VERSION: "0.11.28"

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install dev dependencies
        run: uv sync --group dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

  types:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install all dependencies
        run: uv sync --group dev

      - name: Pyrefly check
        run: uv run pyrefly check

      - name: Pyrefly typing report
        run: |
          mkdir -p reports
          uv run pyrefly report > reports/pyrefly-typing-report.json

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install all dependencies
        run: uv sync --group dev

      - name: Run unit tests
        run: uv run pytest -m "not integration" --cov=src --cov-report=term-missing

  integration-test:
    name: Integration Tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: deepsky
          POSTGRES_USER: deepsky
          POSTGRES_PASSWORD: deepsky
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install all dependencies
        run: uv sync --group dev

      - name: Run Alembic migrations
        env:
          DEEPSKY_DB_HOST: localhost
          DEEPSKY_DB_PORT: 5432
          DEEPSKY_DB_NAME: deepsky
          DEEPSKY_DB_USER: deepsky
          DEEPSKY_DB_PASSWORD: deepsky
        run: uv run alembic upgrade head

      - name: Run integration tests
        env:
          DEEPSKY_DB_HOST: localhost
          DEEPSKY_DB_PORT: 5432
          DEEPSKY_DB_NAME: deepsky
          DEEPSKY_DB_USER: deepsky
          DEEPSKY_DB_PASSWORD: deepsky
        run: uv run pytest -m integration --tb=short

  build:
    name: Build Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8
        with:
          version: ${{ env.UV_VERSION }}

      - name: Build wheel and sdist
        run: uv build
