[project]
name = "deepsky-classifier"
version = "0.2.0"
description = "Astronomical data pipeline and ML classifier for stars, galaxies, and quasars."
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [{ name = "Pierre Ayfri", email = "pierre.ayfri@gmail.com" }]
keywords = ["astronomy", "machine-learning", "etl", "fastapi", "scikit-learn"]
classifiers = [
	"Development Status :: 4 - Beta",
	"License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
	"Programming Language :: Python :: 3.13",
	"Topic :: Scientific/Engineering :: Astronomy",
	"Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
	"alembic>=1.19.1",
	"astropy>=8.0.1",
	"astroquery>=0.4.11",
	"colorama>=0.4.6",
	"fastapi>=0.141.1",
	"httpx2>=2.11.0",
	"joblib>=1.5.3",
	"pandas>=3.0.5",
	"prefect>=3.8.3",
	"psycopg[binary,pool]>=3.3.4",
	"pyarrow>=25.0.1",
	"pydantic>=2.13.4",
	"pydantic-settings>=2.15.0",
	"pyvo>=1.9.1",
	"scikit-learn>=1.9.0",
	"scipy>=1.18.0",
	"sqlalchemy>=2.0.52",
	"tqdm>=4.70.0",
	"uvicorn[standard]>=0.52.3",
]

[project.urls]
Homepage = "https://github.com/Ayfri/deepsky-classifier"
Repository = "https://github.com/Ayfri/deepsky-classifier"

[project.scripts]
deepsky-api = "src.api.main:run"
deepsky-drift = "src.ml.drift:main"
deepsky-optimize = "src.ml.optimize:main"
deepsky-pipeline = "src.workflows.pipeline:main"
deepsky-train = "src.ml.train:main"

[dependency-groups]
dev = [
	"matplotlib>=3.11.1",
	"pyrefly>=1.2.0",
	"pytest>=9.1.1",
	"pytest-asyncio>=1.4.0",
	"pytest-cov>=7.1.0",
	"ruff>=0.16.3",
	"seaborn>=0.13.2",
]
# Kept out of `dev` so CI does not pull a Jupyter stack it never runs.
notebook = [
	"ipykernel>=7.1.0",
	"nbconvert>=7.16.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# Ruff
[tool.ruff]
extend-exclude = [".venv", "build", "data", "dist", "models", "reports"]
line-length = 100
preview = false
target-version = "py313"

[tool.ruff.format]
docstring-code-format = true
indent-style = "tab"
line-ending = "auto"
quote-style = "double"

[tool.ruff.lint]
# Named selectors read better than codes in ignore lists, and they need lint preview mode.
preview = true
select = [
	"A",
	"ANN",
	"ARG",
	"ASYNC",
	"B",
	"BLE",
	"C4",
	"DTZ",
	"E4",
	"E7",
	"E9",
	"F",
	"I",
	"LOG",
	"N",
	"PERF",
	"PIE",
	"PT",
	"PTH",
	"RET",
	"RUF",
	"S",
	"SIM",
	"TC",
	"TRY",
	"UP",
]
ignore = [
	"any-type",
	"assert",
	"blind-except",
	# Exact zero is the signal here: a p-value that underflowed to 0.0, and the 0/1 Gaia astrometry flag.
	"float-equality-comparison",
	"hardcoded-bind-all-interfaces",
	"hardcoded-password-string",
	"hardcoded-sql-expression",
	"import-outside-top-level",
	"missing-trailing-comma",
	"mixed-spaces-and-tabs",
	"non-lowercase-variable-in-function",
	"raise-vanilla-args",
	"single-line-implicit-string-concatenation",
	"tab-indentation",
]

[tool.ruff.lint.per-file-ignores]
"src/api/**/*.py" = ["function-call-in-default-argument"]
"src/core/models.py" = ["hardcoded-sql-expression"]
"src/etl/catalogs/**/*.py" = ["blind-except"]
"src/ml/**/*.py" = ["invalid-argument-name", "non-lowercase-variable-in-function"]
"src/ml/train.py" = ["print"]
"src/workflows/**/*.py" = ["print"]
"tests/**/*.py" = ["ANN", "ARG", "S"]

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true
known-first-party = ["src"]

# Pyrefly
[tool.pyrefly]
min-severity = "error"
output-format = "min-text"
preset = "strict"
project-excludes = [".venv/**", "build/**", "data/**", "dist/**", "models/**", "reports/**"]
project-includes = ["src/**/*.py", "tests/**/*.py"]
python-version = "3.13"
replace-imports-with-any = [
	"astroquery.*",
	"colorama",
	"matplotlib.*",
	"pyvo.*",
	"seaborn",
	"tqdm.*",
]
search-path = ["src"]

# Monkeypatch stubs are throwaway `lambda *_, **__` shims, so the strict preset's implicit-any-lambda check is pure noise here.
[[tool.pyrefly.sub-config]]
matches = "tests/**"

[tool.pyrefly.sub-config.errors]
implicit-any-lambda = false

# Pytest
[tool.pytest.ini_options]
addopts = [
	"--strict-config",
	"--strict-markers",
	"--tb=short",
	"-ra",
]
asyncio_mode = "auto"
filterwarnings = [
	# joblib 1.5.3 assigns array.shape, deprecated by NumPy 2.5. Fixed upstream (joblib#1772), ships in 1.6.0: drop this filter and floor joblib>=1.6.0 then.
	"ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning:joblib.numpy_pickle",
]
markers = [
	"integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
	"slow: marks tests as slow",
]
minversion = "9.0"
testpaths = ["tests"]

# Coverage
[tool.coverage.report]
exclude_lines = [
	"if __name__ == .__main__.:",
	"pragma: no cover",
	"raise NotImplementedError",
]
show_missing = true
skip_covered = false

[tool.coverage.run]
branch = true
omit = ["*/__init__.py", "src/workflows/*"]
source = ["src"]
