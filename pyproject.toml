[project]
name = "deepsky-classifier"
version = "0.2.0"
description = "Astronomical data pipeline and ML classifier for stars, galaxies, and quasars."
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [{ name = "Pierre Ayfri", email = "pierre.ayfri@gmail.com" }]
keywords = ["astronomy", "machine-learning", "etl", "fastapi", "scikit-learn"]
classifiers = [
	"Development Status :: 4 - Beta",
	"License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
	"Programming Language :: Python :: 3.13",
	"Topic :: Scientific/Engineering :: Astronomy",
	"Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
	"alembic>=1.18.5",
	"astropy>=8.0.0",
	"astroquery>=0.4.11",
	"colorama>=0.4.6",
	"fastapi>=0.138.2",
	"httpx>=0.28.1",
	"joblib>=1.5.3",
	"pandas>=3.0.4",
	"prefect>=3.7.6",
	"psycopg[binary,pool]>=3.3.4",
	"pyarrow>=24.0.0",
	"pydantic>=2.13.4",
	"pydantic-settings>=2.14.2",
	"pyvo>=1.9.1",
	"scikit-learn>=1.9.0",
	"scipy>=1.17.1",
	"sqlalchemy>=2.0.51",
	"tqdm>=4.68.3",
	"uvicorn[standard]>=0.49.0",
]

[project.urls]
Homepage = "https://github.com/Ayfri/deepsky-classifier"
Repository = "https://github.com/Ayfri/deepsky-classifier"

[project.scripts]
deepsky-api = "src.api.main:run"
deepsky-optimize = "src.ml.optimize:main"
deepsky-pipeline = "src.workflows.pipeline:deepsky_pipeline"
deepsky-train = "src.ml.train:main"

[dependency-groups]
dev = [
	"matplotlib>=3.11.0",
	"pyrefly>=1.1.1",
	"pytest>=9.1.1",
	"pytest-asyncio>=1.4.0",
	"pytest-cov>=7.1.0",
	"ruff>=0.15.20",
	"seaborn>=0.13.2",
]
# Kept out of `dev` so CI does not pull a Jupyter stack it never runs.
notebook = [
	"ipykernel>=7.1.0",
	"nbconvert>=7.16.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# Ruff
[tool.ruff]
extend-exclude = [".venv", "build", "data", "dist", "models", "reports"]
line-length = 100
preview = false
target-version = "py313"

[tool.ruff.format]
docstring-code-format = true
indent-style = "tab"
line-ending = "auto"
quote-style = "double"

[tool.ruff.lint]
select = [
	"A",
	"ANN",
	"ARG",
	"ASYNC",
	"B",
	"BLE",
	"C4",
	"DTZ",
	"E4",
	"E7",
	"E9",
	"F",
	"I",
	"LOG",
	"N",
	"PERF",
	"PIE",
	"PT",
	"PTH",
	"RET",
	"RUF",
	"S",
	"SIM",
	"TC",
	"TRY",
	"UP",
]
ignore = [
	"ANN401",
	"BLE001",
	"COM812",
	"E101",
	"ISC001",
	"N806",
	"PLC0415",
	"S101",
	"S104",
	"S105",
	"S608",
	"TRY003",
	"W191",
]

[tool.ruff.lint.per-file-ignores]
"src/api/**/*.py" = ["B008"]
"src/core/models.py" = ["S608"]
"src/etl/catalogs/**/*.py" = ["BLE001"]
"src/ml/**/*.py" = ["N803", "N806"]
"src/ml/train.py" = ["T201"]
"src/workflows/**/*.py" = ["T201"]
"tests/**/*.py" = ["ANN", "ARG", "S"]

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true
known-first-party = ["src"]

# Pyrefly
[tool.pyrefly]
min-severity = "error"
output-format = "min-text"
preset = "strict"
project-excludes = [".venv/**", "build/**", "data/**", "dist/**", "models/**", "reports/**"]
project-includes = ["src/**/*.py", "tests/**/*.py"]
python-version = "3.13"
replace-imports-with-any = [
	"astroquery.*",
	"colorama",
	"matplotlib.*",
	"pyvo.*",
	"seaborn",
	"tqdm.*",
]
search-path = ["src"]

# Pytest
[tool.pytest.ini_options]
addopts = [
	"--strict-config",
	"--strict-markers",
	"--tb=short",
	"-ra",
]
asyncio_mode = "auto"
markers = [
	"integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
	"slow: marks tests as slow",
]
minversion = "9.0"
testpaths = ["tests"]

# Coverage
[tool.coverage.report]
exclude_lines = [
	"if __name__ == .__main__.:",
	"pragma: no cover",
	"raise NotImplementedError",
]
show_missing = true
skip_covered = false

[tool.coverage.run]
branch = true
omit = ["*/__init__.py", "src/workflows/*"]
source = ["src"]
