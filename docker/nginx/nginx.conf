worker_processes auto;

events {
	worker_connections 1024;
}

http {
	include mime.types;
	default_type application/octet-stream;
	sendfile on;

	# 10 req/s per client IP, burst of 20: absorbs a legitimate batch call without opening the
	# door to scraping /predict. Applied on the location block below, not globally.
	limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

	server {
		listen 80;
		server_name _;
		# Plain HTTP only serves the redirect: nothing is proxied without TLS.
		return 301 https://$host$request_uri;
	}

	server {
		listen 443 ssl;
		http2 on;
		server_name _;

		ssl_certificate     /etc/nginx/certs/fullchain.pem;
		ssl_certificate_key /etc/nginx/certs/privkey.pem;
		ssl_protocols       TLSv1.3;
		ssl_prefer_server_ciphers off;

		location / {
			limit_req zone=api_limit burst=20 nodelay;

			proxy_pass http://api:8000;
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}
	}
}
